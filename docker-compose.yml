services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://0.0.0.0:5000
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /app/mlruns
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  credit-risk-api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    # No source bind-mount here: the API image ships its own `src/` copy so
    # a container always runs the code it was built from, not whatever the
    # host's working tree happens to contain.

  # One-off training job. Runs at customer grain end-to-end (raw data ->
  # features -> proxy labels -> train -> evaluate -> conditionally promote).
  # Not started by `docker-compose up`; run explicitly with:
  #   docker-compose --profile train run --rm trainer
  trainer:
    build: .
    profiles: ["train"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: ["python", "-m", "src.train"]
